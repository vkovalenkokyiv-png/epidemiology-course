<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Епідеміологія - Конспект лекцій</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Електронний конспект лекцій з епідеміології">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Підключаємо гарну тему оформлення -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Завантаження матеріалів...</div>
  <script>
    window.$docsify = {
      name: 'Епідеміологія',
      repo: '',
      loadSidebar: true, // Увімчимо бічне меню
      auto2top: true,    // Автоматично прокручувати вгору при переході
      search: {          // Налаштування пошуку
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Шукати в лекціях...',
        noData: 'Нічого не знайдено!',
        depth: 6,
      }
    }
  </script>
  <!-- Основні скрипти Docsify та плагін пошуку -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
